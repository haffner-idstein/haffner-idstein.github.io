<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verfügbarkeit</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a2e;
      --ink:#e9eefc;
      --muted:#a8b3d9;
      --hair:rgba(233,238,252,.12);

      --freeBg:rgba(140,255,200,.10);
      --freeBorder:rgba(140,255,200,.35);
      --freeInk:#bfffe1;

      --busyBg:rgba(255,120,120,.12);
      --busyBorder:rgba(255,120,120,.35);
      --busyInk:#ffd0d0;

      --todayBg:rgba(135,185,255,.12);
      --todayBorder:rgba(135,185,255,.45);

      --shadow: 0 14px 40px rgba(0,0,0,.45);
      --radius: 18px;
    }

    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial; background:radial-gradient(1200px 600px at 15% 10%, rgba(135,185,255,.14), transparent 60%), radial-gradient(900px 600px at 85% 15%, rgba(140,255,200,.10), transparent 55%), var(--bg); color:var(--ink);}
    .wrap{max-width: 980px; margin: 40px auto; padding: 0 16px 60px;}

    .card{background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 50%), var(--card); border:1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden;}

    header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 18px 18px 12px; border-bottom:1px solid var(--hair);}
    .title{display:flex; flex-direction:column; gap:4px; min-width: 220px;}
    .title h1{margin:0; font-size: 16px; letter-spacing:.2px; font-weight: 650;}
    .title .sub{color:var(--muted); font-size: 12px; line-height: 1.3;}

    .nav{display:flex; align-items:center; gap:10px;}
    .btn{appearance:none; border:1px solid var(--hair); background: rgba(255,255,255,.03); color:var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 650; cursor:pointer; transition: transform .08s ease, background .15s ease, border-color .15s ease;}
    .btn:hover{background: rgba(255,255,255,.06); border-color: rgba(233,238,252,.20);}
    .btn:active{transform: translateY(1px);}
    .btn:focus-visible{outline: 3px solid rgba(135,185,255,.35); outline-offset: 2px;}
    .btn.small{padding: 8px 10px; font-weight: 650; font-size: 13px;}

    .monthName{font-size: 15px; font-weight: 750; letter-spacing:.2px; padding: 0 8px; min-width: 180px; text-align:center;}

    .body{padding: 14px 18px 18px;}

    .weekdays{display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 0 0 10px;}
    .weekday{color: var(--muted); font-size: 12px; letter-spacing:.5px; text-transform: uppercase; padding: 0 6px;}

    .grid{display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px;}

    .day{
      border: 1px solid var(--hair);
      border-radius: 14px;
      padding: 10px 10px 12px;
      min-height: 70px;
      background: rgba(255,255,255,.02);
      position: relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .day.out{opacity:.45;}
    .day .num{font-weight: 800; font-size: 14px;}
    .day .label{font-size: 12px; color: var(--muted);}

    .day.free{background: linear-gradient(180deg, rgba(140,255,200,.06), transparent 65%), var(--freeBg); border-color: var(--freeBorder);}
    .day.free .label{color: var(--freeInk);}

    .day.busy{background: linear-gradient(180deg, rgba(255,120,120,.08), transparent 65%), var(--busyBg); border-color: var(--busyBorder);}
    .day.busy .label{color: var(--busyInk);}

    .day.today{box-shadow: 0 0 0 1px rgba(135,185,255,.30), 0 10px 30px rgba(0,0,0,.25); border-color: var(--todayBorder);}

    .legend{display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; padding: 12px 18px 16px; border-top:1px solid var(--hair); color: var(--muted); font-size: 12px;}
    .pill{display:inline-flex; align-items:center; gap:8px; padding: 7px 10px; border:1px solid var(--hair); border-radius: 999px; background: rgba(255,255,255,.02);}
    .dot{width:10px; height:10px; border-radius: 999px; display:inline-block;}
    .dot.free{background: rgba(140,255,200,.80);}
    .dot.busy{background: rgba(255,120,120,.80);}
    .dot.today{background: rgba(135,185,255,.85);}

    .note{margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.45;}

    @media (max-width: 560px){
      header{flex-direction:column; align-items:stretch;}
      .nav{justify-content:space-between;}
      .monthName{min-width:auto; flex:1;}
      .day{min-height: 62px; padding: 9px 9px 11px;}
    }

    @media (prefers-reduced-motion: reduce){
      .btn{transition:none;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-label="Verfügbarkeitskalender">
      <header>
        <div class="title">
          <h1>Verfügbarkeit</h1>
          <div class="sub">Monatsansicht · An- und Abreisetage gelten als belegt</div>
        </div>
        <div class="nav" aria-label="Monat wechseln">
          <button class="btn small" id="prev" type="button" aria-label="Vorheriger Monat">←</button>
          <div class="monthName" id="monthName" aria-live="polite"></div>
          <button class="btn small" id="next" type="button" aria-label="Nächster Monat">→</button>
          <button class="btn" id="today" type="button">Heute</button>
        </div>
      </header>

      <div class="body">
        <div class="weekdays" aria-hidden="true">
          <div class="weekday">Mo</div><div class="weekday">Di</div><div class="weekday">Mi</div><div class="weekday">Do</div><div class="weekday">Fr</div><div class="weekday">Sa</div><div class="weekday">So</div>
        </div>
        <div class="grid" id="grid" role="grid" aria-label="Kalendertage"></div>
        <div class="note" id="status"></div>
      </div>

      <div class="legend" aria-label="Legende">
        <span class="pill"><span class="dot free"></span>Frei</span>
        <span class="pill"><span class="dot busy"></span>Belegt</span>
        <span class="pill"><span class="dot today"></span>Heute</span>
      </div>
    </div>
  </div>

  <script>
    // --- Configuration ---
    // The GitHub Action will generate this file.
    const AVAIL_URL = './availability.json';

    // --- Date helpers (local time, day-granular) ---
    function ymd(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
    function startOfDay(d){
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function addDays(d, n){
      const x = new Date(d);
      x.setDate(x.getDate()+n);
      return x;
    }

    // Monday-first index: Mon=0 ... Sun=6
    function weekdayMon0(d){
      const js = d.getDay(); // Sun=0..Sat=6
      return (js + 6) % 7;
    }

    function monthLabel(d){
      return new Intl.DateTimeFormat('de-DE', { month:'long', year:'numeric' }).format(d);
    }

    // --- State ---
    let busySet = new Set();
    let meta = { generated_at: null, source: null };

    const grid = document.getElementById('grid');
    const monthName = document.getElementById('monthName');
    const status = document.getElementById('status');

    const now = new Date();
    const today = startOfDay(now);

    let cursor = new Date(today.getFullYear(), today.getMonth(), 1);

    // --- Rendering ---
    function render(){
      monthName.textContent = monthLabel(cursor);
      grid.innerHTML = '';

      const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const last = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);

      // build a 6-week grid for stable layout
      const startOffset = weekdayMon0(first);
      const gridStart = addDays(first, -startOffset);

      for(let i=0;i<42;i++){
        const d = addDays(gridStart, i);
        const inMonth = d.getMonth() === cursor.getMonth();
        const isToday = ymd(d) === ymd(today);
        const key = ymd(d);
        const isBusy = busySet.has(key);

        const cell = document.createElement('div');
        cell.className = 'day' + (inMonth ? '' : ' out') + (isBusy ? ' busy' : ' free') + (isToday ? ' today' : '');
        cell.setAttribute('role','gridcell');
        cell.setAttribute('aria-label', `${key}: ${isBusy ? 'belegt' : 'frei'}`);

        const top = document.createElement('div');
        top.className = 'num';
        top.textContent = String(d.getDate());

        const bottom = document.createElement('div');
        bottom.className = 'label';
        bottom.textContent = isBusy ? 'Belegt' : 'Frei';

        cell.appendChild(top);
        cell.appendChild(bottom);
        grid.appendChild(cell);
      }

      const metaText = [];
      if(meta?.generated_at) metaText.push(`Stand: ${meta.generated_at}`);
      if(meta?.source) metaText.push(`Quelle: ${meta.source}`);
      status.textContent = metaText.join(' · ');
    }

    function clampCursorToHorizon(){
      // If availability.json provides bounds, keep cursor within.
      if(!meta?.range_start || !meta?.range_end) return;
      const min = new Date(meta.range_start + 'T00:00:00');
      const max = new Date(meta.range_end + 'T00:00:00');

      const firstOfCursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      if(firstOfCursor < new Date(min.getFullYear(), min.getMonth(), 1)){
        cursor = new Date(min.getFullYear(), min.getMonth(), 1);
      }
      if(firstOfCursor > new Date(max.getFullYear(), max.getMonth(), 1)){
        cursor = new Date(max.getFullYear(), max.getMonth(), 1);
      }
    }

    // --- Data loading ---
    async function load(){
      try{
        const res = await fetch(AVAIL_URL, { cache: 'no-store' });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        meta = json.meta || meta;
        busySet = new Set((json.busy_dates || []).map(String));

        clampCursorToHorizon();
        render();
      } catch (e){
        status.textContent = 'Kalenderdaten konnten nicht geladen werden. Bitte später erneut versuchen.';
        console.error(e);
        // Render empty grid anyway so the layout is visible
        render();
      }
    }

    // --- Controls ---
    document.getElementById('prev').addEventListener('click', () => {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
      clampCursorToHorizon();
      render();
    });
    document.getElementById('next').addEventListener('click', () => {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
      clampCursorToHorizon();
      render();
    });
    document.getElementById('today').addEventListener('click', () => {
      cursor = new Date(today.getFullYear(), today.getMonth(), 1);
      clampCursorToHorizon();
      render();
    });

    load();
  </script>
</body>
</html>
